<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RH Autonomous LP Lab — Public Snapshot</title>
  <style>
    :root { color-scheme: dark; --bg:#07090a; --card:#111618; --line:#1f2a2e; --ok:#79eeb2; --muted:#8b9aa0; --text:#e8eef0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:24px; }
    .badge { font: 600 11px/1.2 ui-monospace, monospace; color:#f5d38a; border:1px solid #5a4a22; background:#2a220f; padding:6px 8px; border-radius:999px; }
    .grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .label { color:var(--muted); font-size:13px; }
    .val { font-size:28px; font-weight:650; margin-top:10px; letter-spacing:-0.03em; }
    h1 { font-size:28px; margin:8px 0 0; }
    h2 { font-size:16px; margin:0 0 12px; }
    .muted { color:var(--muted); font-size:13px; line-height:1.5; }
    table { width:100%; border-collapse: collapse; font-size:14px; }
    th, td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    code { font-family: ui-monospace, monospace; font-size:12px; }
    a { color: var(--ok); }
    .err { color:#ff8f8f; }
    .chart-wrap { position:relative; height:180px; }
    .chart-wrap svg { width:100%; height:100%; display:block; }
    .pos { color: var(--ok); }
    .neg { color: #ff8f8f; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="muted">RH / Autonomous LP Lab</div>
      <h1>公開スナップショット</h1>
      <p class="muted" id="meta">loading…</p>
    </div>
    <div class="badge">READ-ONLY / AUTO JSON</div>
  </header>
  <div class="grid" id="kpi"></div>
  <section class="card" style="margin-top:12px">
    <h2>PnL vs B0</h2>
    <p class="muted" id="equity-meta">challenge-level wallet MTM − frozen B0 $1881.69（累積トレードPnLではない）</p>
    <div class="chart-wrap" id="equity-chart"></div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2>Timeline</h2>
    <div id="timeline" class="muted">loading…</div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2>LP</h2>
    <div id="lp" class="muted">loading…</div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2>Meme</h2>
    <div id="meme" class="muted">loading…</div>
  </section>
  <p class="muted" style="margin-top:18px">このページは取引できません。秘密情報は含みません。データ源: <code>../data/latest.json</code>（GitHub Pagesでは <code>./data/latest.json</code>）</p>
</main>
<script>
async function load() {
  const urls = ['./data/latest.json', '../data/latest.json'];
  let data = null, err = null;
  for (const u of urls) {
    try {
      const r = await fetch(u + '?t=' + Date.now());
      if (r.ok) { data = await r.json(); break; }
    } catch (e) { err = e; }
  }
  if (!data) {
    document.getElementById('meta').innerHTML = '<span class="err">latest.json を読めません</span>';
    return;
  }
  document.getElementById('meta').textContent = `生成: ${data.generated_at_jst || '?'} / chain ${data.lab?.chain_id} / wallet ${data.lab?.wallet_public}`;
  const lp = data.lp || {}, meme = data.meme || {}, caps = data.caps || {}, wallet = data.wallet || {};
  const vsB0 = wallet.vs_b0_usd;
  const vsCls = vsB0 == null ? '' : (Number(vsB0) >= 0 ? 'pos' : 'neg');
  document.getElementById('kpi').innerHTML = [
    ['Wallet MTM', wallet.approx_mtm_usd != null ? `$${Number(wallet.approx_mtm_usd).toFixed(2)}` : '—'],
    ['vs B0', vsB0 != null ? `<span class="${vsCls}">${Number(vsB0) >= 0 ? '+' : ''}$${Number(vsB0).toFixed(2)}</span>` : '—'],
    ['LP NAV', lp.nav_usd != null ? `$${Number(lp.nav_usd).toFixed(0)}` : '—'],
    ['LP 稼働', lp.simultaneous_usd != null ? `$${Number(lp.simultaneous_usd).toFixed(0)}` : '—'],
    ['LP 枠', `${caps.lp_max_positions || 3} / $${caps.lp_simultaneous_usd || 800}`],
    ['meme コスト', meme.cost_usd != null ? `$${Number(meme.cost_usd).toFixed(0)}` : '—'],
  ].map(([k,v]) => `<article class="card"><div class="label">${k}</div><div class="val">${v}</div></article>`).join('');
  renderEquity(data.equity_history || []);

  const pools = (lp.pools || []).map(p => `<tr><td>${p.pair}</td><td>${p.fee || ''}</td><td>${p.role || ''}</td></tr>`).join('');
  document.getElementById('lp').innerHTML = `<table><thead><tr><th>Pair</th><th>Fee</th><th>Role</th></tr></thead><tbody>${pools}</tbody></table><p class="muted" style="margin-top:8px">status: ${lp.status || '—'} / NFTs: ${(lp.nft_ids||[]).join(', ')}</p>`;

  const pos = (meme.positions || []).map(p => `<tr><td>${p.symbol}</td><td>${p.amount ?? '—'}</td><td>$${p.cost_usdg ?? '—'}</td><td>${p.status || ''}</td></tr>`).join('');
  document.getElementById('meme').innerHTML = `<table><thead><tr><th>Symbol</th><th>Amount</th><th>Cost</th><th>Status</th></tr></thead><tbody>${pos}</tbody></table><p class="muted" style="margin-top:8px">${meme.marks_note || ''}</p>`;

  const tl = (data.timeline || []).map(e => `<tr><td>${(e.at_jst||'').replace('T',' ').slice(0,16)}</td><td><code>${e.id}</code></td><td>${e.symbol}</td><td>$${e.notional_usd}</td><td><code>${(e.swap_tx||'').slice(0,12)}…</code></td></tr>`).join('');
  document.getElementById('timeline').innerHTML = `<table><thead><tr><th>JST</th><th>Ticket</th><th>Symbol</th><th>Notional</th><th>Swap</th></tr></thead><tbody>${tl}</tbody></table>`;
}

function renderEquity(hist) {
  const meta = document.getElementById('equity-meta');
  const host = document.getElementById('equity-chart');
  const pts = (hist || []).filter(r => r && r.at_jst);
  const valued = pts.filter(r => r.pnl_usd != null && r.total_assets_usd != null);
  if (!pts.length) {
    meta.textContent = 'equity_history はまだありません。フロントエンドはこの配列をプロットできます。';
    host.innerHTML = '';
    return;
  }
  const first = pts[0].at_jst;
  const last = pts[pts.length - 1].at_jst;
  const lastVal = pts[pts.length - 1];
  const pnlTxt = lastVal.pnl_usd == null ? 'n/a' : `${Number(lastVal.pnl_usd) >= 0 ? '+' : ''}$${Number(lastVal.pnl_usd).toFixed(2)}`;
  const q = lastVal.quality || 'estimated';
  const unavail = pts.filter(r => r.quality === 'unavailable' || r.pnl_usd == null).length;
  const partial = pts.filter(r => r.quality === 'partial').length;
  meta.textContent = `${pts.length} pts  ${String(first).slice(0,16).replace('T',' ')} → ${String(last).slice(0,16).replace('T',' ')} JST  /  latest ${pnlTxt} (${q})  /  partial ${partial}  unavailable ${unavail}`;
  if (valued.length < 2) {
    host.innerHTML = '<p class="muted">プロットできる点が不足しています（欠損は 0 補間しません）。</p>';
    return;
  }
  const times = valued.map(r => Date.parse(r.at_jst));
  const ys = valued.map(r => Number(r.pnl_usd));
  const t0 = Math.min(...times), t1 = Math.max(...times);
  const yMin = Math.min(0, ...ys), yMax = Math.max(0, ...ys);
  const pad = Math.max(1, (yMax - yMin) * 0.12);
  const y0 = yMin - pad, y1 = yMax + pad;
  const W = 920, H = 180, L = 44, R = 12, T = 10, B = 22;
  const x = (t) => L + ((t - t0) / (t1 - t0 || 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  // Break the line on time gaps / unavailable — do not interpolate missing periods.
  const gapMs = 45 * 60 * 1000;
  const segs = [];
  let cur = [];
  for (let i = 0; i < valued.length; i++) {
    if (cur.length && (times[i] - times[i - 1] > gapMs)) {
      segs.push(cur);
      cur = [];
    }
    cur.push(`${x(times[i]).toFixed(1)},${y(ys[i]).toFixed(1)}`);
  }
  if (cur.length) segs.push(cur);
  const zeroY = y(0);
  const lastP = valued[valued.length - 1];
  const stroke = Number(lastP.pnl_usd) >= 0 ? '#79eeb2' : '#ff8f8f';
  const paths = segs.filter(s => s.length >= 2).map(s => `<polyline fill="none" stroke="${stroke}" stroke-width="2" points="${s.join(' ')}" />`).join('');
  const dots = segs.flatMap(s => s.length === 1 ? [`<circle cx="${s[0].split(',')[0]}" cy="${s[0].split(',')[1]}" r="2.5" fill="${stroke}" />`] : []);
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PnL vs B0">
    <line x1="${L}" y1="${zeroY.toFixed(1)}" x2="${W-R}" y2="${zeroY.toFixed(1)}" stroke="#1f2a2e" stroke-dasharray="4 4" />
    <text x="6" y="${zeroY.toFixed(1)}" fill="#8b9aa0" font-size="11" dominant-baseline="middle">0</text>
    <text x="6" y="${T+10}" fill="#8b9aa0" font-size="11">${yMax.toFixed(0)}</text>
    <text x="6" y="${H-B+4}" fill="#8b9aa0" font-size="11">${yMin.toFixed(0)}</text>
    ${paths}${dots.join('')}
    <text x="${L}" y="${H-4}" fill="#8b9aa0" font-size="11">${String(valued[0].at_jst).slice(5,16).replace('T',' ')}</text>
    <text x="${W-R}" y="${H-4}" fill="#8b9aa0" font-size="11" text-anchor="end">${String(lastP.at_jst).slice(5,16).replace('T',' ')}</text>
  </svg>`;
}
load();
</script>
</body>
</html>
